<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Fonts - Load early for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Favicon: MD monogram, restyled per theme (synthwave is the default
         and the .ico fallback for browsers without SVG favicon support) -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme bootstrap: pick the theme BEFORE first paint to avoid a flash
         of the wrong theme. Random on each visit until the visitor explicitly
         picks one in the switcher (which persists to localStorage).
         Theme ids and font URLs mirror src/theme/themes.ts — keep in sync. -->
    <script>
      (function () {
        var themes = ["synthwave", "cascadia", "gallery", "pixel", "deepfield"];
        var fonts = {
          cascadia:
            "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,700;125,800&display=swap",
          gallery:
            "https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap",
          pixel:
            "https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=Press+Start+2P&display=swap",
          deepfield:
            "https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&display=swap",
        };
        var theme = null;
        try {
          theme = localStorage.getItem("md-theme");
        } catch (e) {
          /* storage unavailable — fall through to random */
        }
        if (themes.indexOf(theme) === -1) {
          theme = themes[Math.floor(Math.random() * themes.length)];
        }
        document.documentElement.setAttribute("data-theme", theme);
        var favicons = {
          cascadia: "/favicon-cascadia.svg",
          gallery: "/favicon-gallery.svg",
          pixel: "/favicon-pixel.svg",
          deepfield: "/favicon-deepfield.svg",
        };
        var fav = document.getElementById("favicon");
        if (fav && favicons[theme]) {
          fav.setAttribute("href", favicons[theme]);
        }
        if (fonts[theme]) {
          var link = document.createElement("link");
          link.id = "theme-fonts-" + theme;
          link.rel = "stylesheet";
          link.href = fonts[theme];
          document.head.appendChild(link);
        }
      })();
    </script>

    <title>Mike DiMaria - UX Research Portfolio</title>
    <meta name="description" content="UX Research Portfolio - Mike DiMaria. Modern UX Researcher specializing in complex product domains and GenAI-enhanced research methodologies." />
    <meta name="author" content="Mike DiMaria" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Mike DiMaria - UX Research Portfolio" />
    <meta property="og:description" content="UX Research Portfolio - Decoding Complexity through Modern UX Research" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mike-dimaria.com" />
    <!-- Uses site favicon; for richer previews add a 1200×630 PNG at /og-image.png and point these URLs there -->
    <meta property="og:image" content="https://mike-dimaria.com/favicon.svg" />
    <meta property="og:image:alt" content="Mike DiMaria — UX Research Portfolio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mike-dimaria.com/favicon.svg" />
    <meta name="twitter:title" content="Mike DiMaria - UX Research Portfolio" />
    <meta name="twitter:description" content="UX Research Portfolio - Decoding Complexity through Modern UX Research" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
